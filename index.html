<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#182a22"><title>Frontier Defense</title>
<style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14231d;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#hud{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:13px;text-shadow:0 1px 3px black}#hud span{background:#162a24c9;padding:7px 10px;border-radius:8px}#hud b{color:#a9f2c0}#controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.panel{pointer-events:auto;background:#152720e8;border:1px solid #66816d;border-radius:12px;padding:8px}#map{width:105px;height:82px;touch-action:none}#joy{height:122px;width:122px;border-radius:50%;border:2px solid #a4c5a4;background:#183a30bb;position:relative;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#a4d4b1;box-shadow:0 0 0 2px #315543}#actions{position:fixed;bottom:max(115px,calc(env(safe-area-inset-bottom) + 115px));left:12px;display:flex;gap:5px;flex-wrap:wrap;max-width:60vw}button{background:#244737;border:1px solid #83b78c;color:white;border-radius:8px;padding:9px;font-weight:600}#production{display:none;position:fixed;left:12px;top:90px;width:min(270px,72vw);padding:12px;border:1px solid #83b78c;border-radius:12px;background:#152720f2;z-index:5}#production h3{font-size:15px;margin:0 0 8px}#slots{display:flex;gap:5px;margin-bottom:10px}#slots>div{flex:1;height:43px;min-width:0;border:1px solid #72977c;border-radius:6px;background:#263e31;position:relative;text-align:center;font-size:17px;padding-top:8px;overflow:hidden}#slots .bar{position:absolute;bottom:0;left:0;height:5px;background:#8bec9f}#production button{width:100%}#deposit{display:none;position:fixed;z-index:6;background:#152720ed;color:#e8f8e8;border:1px solid #a1d8a7;border-radius:9px;padding:7px 11px;font-size:13px;pointer-events:none;white-space:nowrap}#selectMode{position:fixed;right:12px;top:52px;z-index:9;background:#254c38;border:2px solid #b4e6b5;padding:10px 12px;min-width:112px}#selectMode.active{background:#a3e6ae;color:#10241a}#hint{position:fixed;top:52px;left:10px;font-size:12px;background:#14251fc9;padding:7px;border-radius:6px;pointer-events:none;max-width:70vw}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>💎 <b id="minerals">200</b></span><span>👥 <b id="supply">1 / 10</b></span><span>🏢 Frontier Defense v0.5</span></div><div id="hint">Tap SELECT, then tap a unit or building. Or hold it. Short tap to move or gather.</div><button id="selectMode">🎯 SELECT</button><div id="deposit"></div><div id="actions"></div><div id="production"><h3>🏢 Command Center · Production</h3><div id="slots"></div><button id="train">🔧 Train SCV · 💎 20 · 10s</button></div><div id="controls"><canvas class="panel" id="map" width="210" height="164"></canvas><div id="joy"><div id="knob"></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#map'),mc=mini.getContext('2d'),joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),actions=document.querySelector('#actions'),hint=document.querySelector('#hint'),production=document.querySelector('#production'),slots=document.querySelector('#slots'),train=document.querySelector('#train'),deposit=document.querySelector('#deposit'),selectButton=document.querySelector('#selectMode');
let W=0,H=0,dpr=1,zoom=1,cam={x:1100,y:850},money=200,selected=null,selectedMineral=null,placing=false,joyX=0,joyY=0,drag=null,last=performance.now(),touches=new Map(),pinch=0,selectMode=false;
const world={w:2800,h:2100},base={x:1400,y:1050,r:48},units=[makeSCV(1510,1110)],minerals=[{x:1210,y:900,n:100},{x:1150,y:950,n:100},{x:1230,y:1010,n:100},{x:1340,y:830,n:100},{x:1090,y:1040,n:100}],depots=[],trees=[],rocks=[],queue=[];let nextId=2,queueElapsed=0;
function makeSCV(x,y){return{id:1,x,y,tx:x,ty:y,speed:115,load:0,task:'idle',target:null,timer:0}}
function selectedUnit(){return typeof selected==='number'?units.find(u=>u.id===selected):null}
function supplyCap(){return 10+depots.length*10}
function refreshQueue(){slots.replaceChildren();for(let i=0;i<5;i++){let slot=document.createElement('div');slot.textContent=i<queue.length?'🔧':'·';if(i===0&&queue.length){let bar=document.createElement('div');bar.className='bar';bar.style.width=(queueElapsed/10*100)+'%';slot.append(bar)}slots.append(slot)}train.disabled=money<20||queue.length>=5||units.length+queue.length>=supplyCap();train.style.opacity=train.disabled?'.5':'1'}
train.addEventListener('click',()=>{if(money<20){msg('Need 20 minerals');return}if(queue.length>=5){msg('Production queue full');return}if(units.length+queue.length>=supplyCap()){msg('Build a Supply Depot for more supply');return}money-=20;queue.push('scv');refreshQueue();msg('SCV queued for production')});
function showPanel(){production.style.display=selected==='base'?'block':'none';if(selected==='base')refreshQueue()}
function positionOverlays(){if(selected==='base'){const p=screenPt(base.x,base.y),w=production.offsetWidth,h=production.offsetHeight;let left=p.x+62,top=p.y-h/2;if(left+w>W-8)left=p.x-62-w;if(left<8)left=8;top=Math.max(54,Math.min(H-h-10,top));production.style.left=left+'px';production.style.top=top+'px'}
if(selectedMineral&&selectedMineral.n>0){let p=screenPt(selectedMineral.x,selectedMineral.y);if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){deposit.style.display='none'}else{deposit.style.display='block';deposit.textContent='💎 '+selectedMineral.n+'/100';deposit.style.left=Math.max(6,Math.min(W-90,p.x-40))+'px';deposit.style.top=Math.max(55,Math.min(H-42,p.y-65))+'px'}}else deposit.style.display='none'}
let seed=44;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<165;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>250)trees.push({x,y})}
for(let i=0;i<42;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>240)rocks.push({x,y})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function worldPt(sx,sy){return{x:(sx-W/2)/zoom+cam.x,y:(sy-H/2)/zoom+cam.y}}
function screenPt(x,y){return{x:(x-cam.x)*zoom+W/2,y:(y-cam.y)*zoom+H/2}}
function clampCam(){cam.x=Math.max(W/(2*zoom),Math.min(world.w-W/(2*zoom),cam.x));cam.y=Math.max(H/(2*zoom),Math.min(world.h-H/(2*zoom),cam.y))}
function msg(s){hint.textContent=s}
function buttons(){actions.replaceChildren();showPanel();const u=selectedUnit();if(u){for(const [label,fn] of [['⛏ Gather',()=>{let m=minerals.filter(m=>m.n>0).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];if(m){u.target=m;u.task='mine';msg('SCV gathering minerals')}else msg('No minerals left')}],['🏗 Depot 20',()=>{if(money<20){msg('Need 20 minerals');return}placing=true;msg('Tap open ground to place a Supply Depot')}],['✖ Deselect',()=>{selected=null;buttons()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}}}
function haptic(){if(navigator.vibrate)navigator.vibrate(12)}
function findTarget(p){let u=units.find(u=>Math.hypot(p.x-u.x,p.y-u.y)<30);if(u)return{kind:'unit',value:u};if(Math.hypot(p.x-base.x,p.y-base.y)<55)return{kind:'base'};let m=minerals.find(m=>m.n>0&&Math.hypot(p.x-m.x,p.y-m.y)<43);if(m)return{kind:'mineral',value:m};let d=depots.find(d=>Math.hypot(p.x-d.x,p.y-d.y)<36);if(d)return{kind:'depot',value:d};return null}
function selectAt(p){selectMode=false;selectButton.classList.remove('active');selectButton.textContent='🎯 SELECT';placing=false;let t=findTarget(p);selectedMineral=null;if(!t){selected=null;msg('Nothing selected')}else if(t.kind==='unit'){selected=t.value.id;msg('SCV selected. Tap ground to move or minerals to gather.')}else if(t.kind==='base'){selected='base';msg('Command Center selected. Train SCVs in the queue.')}else if(t.kind==='mineral'){selected=null;selectedMineral=t.value;msg('Mineral deposit: '+t.value.n+'/100 remaining')}else{selected=null;msg('Supply Depot selected. +10 supply capacity')}buttons();haptic()}
function order(p){if(placing){if(money<20)return;if(Math.hypot(p.x-base.x,p.y-base.y)<115||depots.some(d=>Math.hypot(p.x-d.x,p.y-d.y)<70)){msg('Choose a spot farther from buildings');return}money-=20;depots.push({x:p.x,y:p.y});placing=false;let u=selectedUnit();if(u){u.task='move';u.tx=p.x;u.ty=p.y}msg('Supply Depot constructed. +10 supply');buttons();haptic();return}
const u=selectedUnit(),t=findTarget(p);if(u){if(t&&t.kind==='mineral'){u.task='mine';u.target=t.value;msg('SCV collecting minerals')}else if(!t){u.task='move';u.tx=p.x;u.ty=p.y;msg('SCV moving')}else{msg('Hold to select that object')}haptic()}else{msg('Hold an SCV or Command Center to select it');haptic()}}
const HOLD_MS=520,MOVE_TOLERANCE=18;
selectButton.addEventListener('click',()=>{selectMode=!selectMode;selectButton.classList.toggle('active',selectMode);selectButton.textContent=selectMode?'👆 TAP TARGET':'🎯 SELECT';msg(selectMode?'Tap an SCV, Command Center, or mineral to select it':'Selection mode off')});
function cancelHold(t){if(t&&t.timer){clearTimeout(t.timer);t.timer=null}}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
function startTouch(id,x,y){const t={startX:x,startY:y,x,y,moved:false,held:false,timer:null};touches.set(id,t);if(touches.size>1){for(const v of touches.values())cancelHold(v);const a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}else{t.timer=setTimeout(()=>{if(touches.size===1&&!t.moved){t.held=true;selectAt(worldPt(t.startX,t.startY))}},HOLD_MS)}}
function moveTouch(id,x,y){const t=touches.get(id);if(!t)return;t.x=x;t.y=y;if(Math.hypot(x-t.startX,y-t.startY)>MOVE_TOLERANCE){t.moved=true;cancelHold(t)}if(touches.size===2){const a=[...touches.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom=Math.max(.55,Math.min(1.8,zoom*dist/pinch));pinch=dist;clampCam()}}
function endTouch(id,x,y,cancelled=false){const t=touches.get(id);if(!t)return;cancelHold(t);if(!cancelled&&touches.size===1&&!t.held&&!t.moved){const p=worldPt(x,y);if(selectMode)selectAt(p);else order(p)}touches.delete(id);pinch=0}
canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)startTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)moveTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)endTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchcancel',e=>{e.preventDefault();for(const t of e.changedTouches)endTouch(t.identifier,t.clientX,t.clientY,true)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;canvas.setPointerCapture(e.pointerId);startTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;moveTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;endTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointercancel',e=>{if(e.pointerType==='touch')return;endTouch(e.pointerId,e.clientX,e.clientY,true)});
function setJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),mag=Math.hypot(x,y),f=Math.min(mag,43)/(mag||1);joyX=x*f/43;joyY=y*f/43;knob.style.transform='translate('+x*f+'px,'+y*f+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});function resetJoy(){joyX=joyY=0;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
mini.addEventListener('pointerdown',e=>{let r=mini.getBoundingClientRect();cam.x=(e.clientX-r.left)/r.width*world.w;cam.y=(e.clientY-r.top)/r.height*world.h;clampCam()});
function approach(u,x,y,speed,dt){let dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy);if(d<=speed*dt){u.x=x;u.y=y;return true}u.x+=dx/d*speed*dt;u.y+=dy/d*speed*dt;return false}
function update(dt){cam.x+=joyX*650*dt/zoom;cam.y+=joyY*650*dt/zoom;clampCam();
if(queue.length){queueElapsed+=dt;if(queueElapsed>=10){queueElapsed-=10;queue.shift();let n=units.length,u=makeSCV(base.x+65+(n%4)*24,base.y+65+Math.floor(n/4)*24);u.id=nextId++;units.push(u);msg('New SCV ready!');refreshQueue()}}
for(const u of units){
if(u.task==='move'){if(approach(u,u.tx,u.ty,u.speed,dt))u.task='idle'}
if(u.task==='mine'&&u.target){let m=u.target;if(m.n<=0){u.target=minerals.filter(m=>m.n>0).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0]||null;if(!u.target){u.task='idle';continue}m=u.target}if(approach(u,m.x+22,m.y+20,u.speed,dt)){u.task='mining';u.timer=1.3}}
else if(u.task==='mining'){u.timer-=dt;if(u.timer<=0){u.load=Math.min(10,u.target.n);u.target.n-=u.load;u.task='return';if(u.target.n<=0)msg('Mineral deposit depleted!')}}
else if(u.task==='return'){if(approach(u,base.x+60,base.y+10,u.speed,dt)){money+=u.load;u.load=0;u.task='mine'}}
}
if(selectedMineral&&selectedMineral.n<=0)selectedMineral=null;document.querySelector('#minerals').textContent=money;document.querySelector('#supply').textContent=units.length+' / '+supplyCap();if(selected==='base'){let bar=slots.querySelector('.bar');if(bar)bar.style.width=(queueElapsed/10*100)+'%';train.disabled=money<20||queue.length>=5||units.length+queue.length>=supplyCap();train.style.opacity=train.disabled?'.5':'1'}}
function emoji(t,x,y,size){ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#42663e';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-cam.x*zoom,H/2-cam.y*zoom);ctx.scale(zoom,zoom);ctx.fillStyle='#526f46';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#78936b44';ctx.lineWidth=1;for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(const t of trees)emoji('🌲',t.x,t.y,35);for(const r of rocks)emoji('🪨',r.x,r.y,30);for(const m of minerals)if(m.n>0)emoji('💎',m.x,m.y,37);
if(selectedMineral&&selectedMineral.n>0){ctx.strokeStyle='#b8f9ce';ctx.lineWidth=3;ctx.beginPath();ctx.arc(selectedMineral.x,selectedMineral.y,30,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#334c57';ctx.strokeStyle='#d0e6e9';ctx.lineWidth=4;ctx.fillRect(base.x-48,base.y-43,96,86);ctx.strokeRect(base.x-48,base.y-43,96,86);emoji('🏢',base.x,base.y,48);if(selected==='base'){ctx.strokeStyle='#7df3a1';ctx.lineWidth=3;ctx.strokeRect(base.x-53,base.y-48,106,96)}
for(const d of depots){ctx.fillStyle='#7b7553';ctx.fillRect(d.x-27,d.y-25,54,50);emoji('📦',d.x,d.y,32)}
for(const u of units){if(selected===u.id){ctx.strokeStyle='#70f18b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(u.x,u.y+14,24,11,0,0,Math.PI*2);ctx.stroke()}emoji('🔧',u.x,u.y,31);if(u.load)emoji('💎',u.x+19,u.y-15,18)}ctx.restore();
mc.fillStyle='#4b6743';mc.fillRect(0,0,210,164);mc.fillStyle='#80e3a1';mc.fillRect(base.x/world.w*210-3,base.y/world.h*164-3,6,6);mc.fillStyle='#a6dcff';for(const m of minerals)if(m.n>0)mc.fillRect(m.x/world.w*210,m.y/world.h*164,3,3);mc.strokeStyle='#f4f7d1';mc.lineWidth=2;mc.strokeRect((cam.x-W/(2*zoom))/world.w*210,(cam.y-H/(2*zoom))/world.h*164,W/zoom/world.w*210,H/zoom/world.h*164)}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();positionOverlays();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
