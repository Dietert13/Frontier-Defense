<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#182a22"><title>Frontier Defense</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14231d;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:13px;text-shadow:0 1px 3px black}#hud span{background:#162a24c9;padding:7px 10px;border-radius:8px}#hud b{color:#a9f2c0}#controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.panel{pointer-events:auto;background:#152720e8;border:1px solid #66816d;border-radius:12px;padding:8px}#map{width:105px;height:82px;touch-action:none}#joy{height:122px;width:122px;border-radius:50%;border:2px solid #a4c5a4;background:#183a30bb;position:relative;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#a4d4b1;box-shadow:0 0 0 2px #315543}#actions{position:fixed;bottom:max(115px,calc(env(safe-area-inset-bottom) + 115px));left:12px;display:flex;gap:5px;flex-wrap:wrap;max-width:60vw}button{background:#244737;border:1px solid #83b78c;color:white;border-radius:8px;padding:9px;font-weight:600}#hint{position:fixed;top:52px;left:10px;font-size:12px;background:#14251fc9;padding:7px;border-radius:6px;pointer-events:none;max-width:70vw}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>💎 <b id="minerals">200</b></span><span>👥 <b id="supply">1 / 10</b></span><span>🏢 Frontier Defense v0.1</span></div><div id="hint">Tap 🔧 to select your SCV. Tap 💎 to mine. Use the joystick to pan.</div><div id="actions"></div><div id="controls"><canvas class="panel" id="map" width="210" height="164"></canvas><div id="joy"><div id="knob"></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#map'),mc=mini.getContext('2d'),joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),actions=document.querySelector('#actions'),hint=document.querySelector('#hint');
let W=0,H=0,dpr=1,zoom=1,cam={x:1100,y:850},money=200,selected=null,placing=false,joyX=0,joyY=0,drag=null,last=performance.now(),touches=new Map(),pinch=0;
const world={w:2800,h:2100},base={x:1400,y:1050,r:48},scv={x:1510,y:1110,tx:1510,ty:1110,speed:115,load:0,task:'idle',target:null},minerals=[{x:1210,y:900,n:1800},{x:1150,y:950,n:1800},{x:1230,y:1010,n:1800},{x:1340,y:830,n:1800},{x:1090,y:1040,n:1800}],depots=[],trees=[],rocks=[];
let seed=44;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<165;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>250)trees.push({x,y})}
for(let i=0;i<42;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>240)rocks.push({x,y})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function worldPt(sx,sy){return{x:(sx-W/2)/zoom+cam.x,y:(sy-H/2)/zoom+cam.y}}
function screenPt(x,y){return{x:(x-cam.x)*zoom+W/2,y:(y-cam.y)*zoom+H/2}}
function clampCam(){cam.x=Math.max(W/(2*zoom),Math.min(world.w-W/(2*zoom),cam.x));cam.y=Math.max(H/(2*zoom),Math.min(world.h-H/(2*zoom),cam.y))}
function msg(s){hint.textContent=s}
function buttons(){actions.replaceChildren();if(selected==='scv'){for(const [label,fn] of [['⛏ Gather',()=>{let m=minerals.find(m=>m.n>0);if(m){scv.target=m;scv.task='mine';msg('SCV gathering minerals')}}],['🏗 Depot 100',()=>{if(money<100){msg('Need 100 minerals');return}placing=true;msg('Tap open ground to place a Supply Depot')}],['✖ Deselect',()=>{selected=null;buttons()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}}}
function order(p){if(placing){if(money<100)return;if(Math.hypot(p.x-base.x,p.y-base.y)<115||depots.some(d=>Math.hypot(p.x-d.x,p.y-d.y)<70)){msg('Choose a spot farther from buildings');return}money-=100;depots.push({x:p.x,y:p.y});placing=false;scv.task='move';scv.tx=p.x;scv.ty=p.y;msg('Supply Depot constructed. +10 supply');return}
if(Math.hypot(p.x-scv.x,p.y-scv.y)<30){selected='scv';buttons();msg('SCV selected. Tap minerals to gather or terrain to move.');return}
if(Math.hypot(p.x-base.x,p.y-base.y)<55){selected='base';buttons();msg('Command Center selected.');return}
let m=minerals.find(m=>m.n>0&&Math.hypot(p.x-m.x,p.y-m.y)<43);
if(selected==='scv'){if(m){scv.task='mine';scv.target=m;msg('SCV mining minerals')}else{scv.task='move';scv.tx=p.x;scv.ty=p.y;msg('SCV moving')}}else{selected=null;buttons()}}
canvas.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});if(touches.size===2){let a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
canvas.addEventListener('pointermove',e=>{let t=touches.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;if(touches.size===2){let a=[...touches.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom=Math.max(.55,Math.min(1.8,zoom*dist/pinch));pinch=dist;clampCam()}});
canvas.addEventListener('pointerup',e=>{let t=touches.get(e.pointerId);if(t&&touches.size===1&&Math.hypot(t.x-t.startX,t.y-t.startY)<20)order(worldPt(e.clientX,e.clientY));touches.delete(e.pointerId);pinch=0});
canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
function setJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),mag=Math.hypot(x,y),f=Math.min(mag,43)/(mag||1);joyX=x*f/43;joyY=y*f/43;knob.style.transform='translate('+x*f+'px,'+y*f+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});function resetJoy(){joyX=joyY=0;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
mini.addEventListener('pointerdown',e=>{let r=mini.getBoundingClientRect();cam.x=(e.clientX-r.left)/r.width*world.w;cam.y=(e.clientY-r.top)/r.height*world.h;clampCam()});
function approach(x,y,speed,dt){let dx=x-scv.x,dy=y-scv.y,d=Math.hypot(dx,dy);if(d<=speed*dt){scv.x=x;scv.y=y;return true}scv.x+=dx/d*speed*dt;scv.y+=dy/d*speed*dt;return false}
function update(dt){cam.x+=joyX*650*dt/zoom;cam.y+=joyY*650*dt/zoom;clampCam();
if(scv.task==='move'){if(approach(scv.tx,scv.ty,scv.speed,dt))scv.task='idle'}
if(scv.task==='mine'&&scv.target){let m=scv.target;if(m.n<=0){scv.task='idle';return}if(approach(m.x+22,m.y+20,scv.speed,dt)){scv.task='mining';scv.timer=1.3}}
else if(scv.task==='mining'){scv.timer-=dt;if(scv.timer<=0){scv.load=Math.min(10,scv.target.n);scv.target.n-=scv.load;scv.task='return'}}
else if(scv.task==='return'){if(approach(base.x+60,base.y+10,scv.speed,dt)){money+=scv.load;scv.load=0;scv.task='mine'}}
document.querySelector('#minerals').textContent=money;document.querySelector('#supply').textContent='1 / '+(10+depots.length*10)}
function emoji(t,x,y,size){ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#42663e';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-cam.x*zoom,H/2-cam.y*zoom);ctx.scale(zoom,zoom);ctx.fillStyle='#526f46';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#78936b44';ctx.lineWidth=1;for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(const t of trees)emoji('🌲',t.x,t.y,35);for(const r of rocks)emoji('🪨',r.x,r.y,30);for(const m of minerals)if(m.n>0)emoji('💎',m.x,m.y,37);
ctx.fillStyle='#334c57';ctx.strokeStyle='#d0e6e9';ctx.lineWidth=4;ctx.fillRect(base.x-48,base.y-43,96,86);ctx.strokeRect(base.x-48,base.y-43,96,86);emoji('🏢',base.x,base.y,48);
for(const d of depots){ctx.fillStyle='#7b7553';ctx.fillRect(d.x-27,d.y-25,54,50);emoji('📦',d.x,d.y,32)}
if(selected==='scv'){ctx.strokeStyle='#70f18b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(scv.x,scv.y+14,24,11,0,0,Math.PI*2);ctx.stroke()}
emoji('🔧',scv.x,scv.y,31);if(scv.load)emoji('💎',scv.x+19,scv.y-15,18);ctx.restore();
mc.fillStyle='#4b6743';mc.fillRect(0,0,210,164);mc.fillStyle='#80e3a1';mc.fillRect(base.x/world.w*210-3,base.y/world.h*164-3,6,6);mc.fillStyle='#a6dcff';for(const m of minerals)if(m.n>0)mc.fillRect(m.x/world.w*210,m.y/world.h*164,3,3);mc.strokeStyle='#f4f7d1';mc.lineWidth=2;mc.strokeRect((cam.x-W/(2*zoom))/world.w*210,(cam.y-H/(2*zoom))/world.h*164,W/zoom/world.w*210,H/zoom/world.h*164)}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
