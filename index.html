y:none;width:100%;padding:0;background:transparent}#production h3{font-size:15px;margin:0 0 8px}#slots{display:flex;gap:5px;margin-bottom:10px}#slots>div{flex:1;height:34px;min-width:0;border:1px solid #72977c;border-radius:6px;background:#263e31;position:relative;text-align:center;font-size:17px;padding-top:8px;overflow:hidden}#slots .bar{position:absolute;bottom:0;left:0;height:5px;background:#8bec9f}#production button{width:100%;min-height:43px}#commandPanel:has(#production[style*='block']) #actions{display:none}#commandPanel{box-shadow:0 0 0 2px #253e3a,0 -4px 22px #0008;background:linear-gradient(145deg,#263f3b,#0e1c1c)}@media(max-width:620px){#commandPanel{left:120px;right:8px;width:auto;min-width:0}#actions{grid-template-columns:repeat(2,minmax(0,1fr))}#production h3{font-size:12px}#slots>div{font-size:13px}}#deposit{display:none;position:fixed;z-index:6;background:#152720ed;color:#e8f8e8;border:1px solid #a1d8a7;border-radius:9px;padding:7px 11px;font-size:13px;pointer-events:none;white-space:nowrap}#selectMode{position:fixed;right:12px;top:52px;z-index:9;background:#254c38;border:2px solid #b4e6b5;padding:10px 12px;min-width:112px}#selectMode.active{background:#a3e6ae;color:#10241a}#hint{position:fixed;top:52px;left:10px;font-size:12px;background:#14251fc9;padding:7px;border-radius:6px;pointer-events:none;max-width:70vw}#placementControls{display:none;position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(clamp(116px,22dvh,175px) + 14px);gap:18px;align-items:center;justify-content:center;pointer-events:auto}#placementControls button{min-width:72px;min-height:54px;font-size:25px;font-weight:900;border:2px solid #d9f7e0;box-shadow:0 3px 14px #000a}#confirmPlacement{background:#247e4a}#cancelPlacement{background:#8d3030}#bottomHud{position:fixed;bottom:0;left:0;right:0;height:clamp(116px,22dvh,175px);padding:7px 7px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(82px,19%) minmax(0,1fr) minmax(118px,30%);gap:5p px;padding:4px;font-size:11px;background:#214e6a;border-color:#619fcb}@media(max-width:620px){#commandPanel{left:auto;right:auto;width:auto;min-width:0}#actions{grid-template-columns:repeat(2,minmax(0,1fr))}#bottomHud{grid-template-columns:minmax(78px,20%) minmax(0,1fr) minmax(110px,31%)}#infoPortrait{width:36px;height:36px;font-size:21px}#infoPanel{padding:4px}#infoDetails{font-size:10px}} /* Larger touch targets and responsive landscape HUD */

<body><canvas id="game"></canvas><div id="hud"><span>💎 <b id="minerals">200</b></span><span>👥 <b id="supply">1 / 10</b></span><span>🏢 Frontier Defense v2.1</span><span id="waveStatus">PREP 2:00 · Wave 1</span></div><div id="hint">PC: Left-click select · Right-click order · Drag select · WASD pan · Esc deselect. Touch controls remain available.</div><div id="deposit"></div><div id="placementControls"><button id="confirmPlacement" aria-label="Confirm building position">✓</button><button id="cancelPlacement" aria-label="Cancel building placement">✕</button></div><div id="bottomHud"><div id="controls"><canvas class="panel" id="map" width="210" height="164"></canvas></div><div id="infoPanel"><div id="infoName">NO SELECTION</div><div id="infoBody"><div id="infoPortrait">⌖</div><div id="infoDetails">Tap a unit or building</div></div><div id="infoQueue"></div></div><div id="commandPanel"><div id="panelTitle">COMMANDS</div><div id="actions"></div><div id="production"><h3>Production</h3><div id="slots"></div><button id="train">🔧 Train SCV · 💎 50 · 10s</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#map'),mc=mini.getContext('2d'),actions=document.querySelector('#actions'),hint=document.querySelector('#hint'),production=document.querySelector('#production'),slots=document.querySelector('#slots'),train=document.querySelector('#train'),deposit=document.querySelector('#deposit');
let W=0,H=0,dpr=1,zoom=1,cam={x:1100,y:850},money=200,selected=null,selectedMineral=null,placing=false,buildMenu=false,buildType=null,ghost=null,joyX=0,joyY=0,drag=null,last=performance.now(),touches=new Map(),pinch=0,commandMode=null;
const world={w:2800,h:2100},base={x:1400,y:1050,r:48,hp:1500,maxHp:1500,damage:0,range:0,attackCooldown:0},units=[makeSCV(1510,1110)],minerals=[{x:1135,y:825,n:1500},{x:1195,y:800,n:1500},{x:1255,y:790,n:1500},{x:1315,y:800,n:1500},{x:1095,y:885,n:1500},{x:1075,y:945,n:1500},{x:1085,y:1005,n:1500},{x:1125,y:1065,n:1500}],depots=[],barracks=[],shops=[],bunkers=[],turrets=[],marines=[],firebats=[],goliaths=[],tanks=[],trees=[],rocks=[],queue=[];let nextId=2,queueElapsed=0;
// Economy: each mineral patch holds 1500; SCVs carry 8 per trip. Gas costs are not yet implemented.
// Combat statistics: damage per attack, range in world units, cooldown in seconds.
const UNIT_STATS={
 scv:{hp:60,damage:5,range:24,cooldown:1.5,speed:115,attack:'melee'},
 marine:{hp:45,damage:6,range:155,cooldown:.86,speed:125,attack:'ranged'},
 firebat:{hp:65,damage:12,range:55,cooldown:1.2,speed:105,attack:'splash'},
 medic:{hp:60,damage:0,range:85,cooldown:1.2,speed:115,attack:'heal',heal:12},
 goliath:{hp:125,damage:15,range:175,cooldown:1.35,speed:95,attack:'ranged'},
 tank:{hp:160,damage:30,range:180,cooldown:2.1,speed:75,attack:'ranged'},
 tank_siege:{hp:160,damage:70,range:310,cooldown:3.0,speed:0,attack:'splash'},
 zergling:{hp:35,damage:5,range:26,cooldown:.7,speed:155,attack:'melee'},
 hydralisk:{hp:90,damage:12,range:165,cooldown:1.25,speed:105,attack:'ranged'},
 ultralisk:{hp:500,damage:40,range:46,cooldown:1.6,speed:78,attack:'melee'},
 queen_of_blades:{hp:1500,damage:65,range:210,cooldown:1.2,speed:115,attack:'boss'}
};
const BUILDING_STATS={command_center:{hp:1500,damage:0,range:0,cooldown:0},depot:{hp:300,damage:0,range:0,cooldown:0},barracks:{hp:600,damage:0,range:0,cooldown:0},shop:{hp:650,damage:0,range:0,cooldown:0},bunker:{hp:400,damage:6,range:160,cooldown:.86},turret:{hp:250,damage:20,range:230,cooldown:1.3}};
function combatStats(kind,sieged=false){return UNIT_STATS[kind==='tank'&&sieged?'tank_siege':kind]||UNIT_STATS.marine}
function statLine(kind,sieged=false){const st=combatStats(kind,sieged);return 'HP '+st.hp+' · ATK '+st.damage+' · RNG '+st.range+' · '+(st.cooldown? (1/st.cooldown).toFixed(1)+'/s':'0/s')}
function makeSCV(x,y){return{id:1,x,y,tx:x,ty:y,speed:115,hp:60,maxHp:60,damage:5,range:24,attackCooldown:1.5,load:0,task:'idle',target:null,timer:0,mineMode:null}}
function selectedUnit(){return typeof selected==='number'?units.find(u=>u.id===selected):null}
const troops=()=>[...marines,...firebats,...goliaths,...tanks];const used=()=>units.length+marines.length+firebats.length*2+goliaths.length*2+tanks.length*2;
function supplyCap(){return 10+depots.filter(d=>d.progress>=1).length*10}
function cancelQueueItem(source,index){if(source==='base'){if(index<0||index>=queue.length)return;queue.splice(index,1);money+=50;if(index===0)queueElapsed=0;refreshQueue();msg('SCV canceled · 50 minerals refunded')}else{const b=selectedBuilding;if(!b||!['barracks','shop'].includes(selected)||index<0||index>=b.training.length)return;const kind=b.training.splice(index,1)[0];money+=({marine:50,firebat:50,goliath:150,tank:250})[kind];if(index===0)b.trainTime=0;msg(kind.toUpperCase()+' canceled · minerals refunded')}refreshInfo()}
function refreshQueue(){slots.replaceChildren();for(let i=0;i<5;i++){let slot=document.createElement('div');slot.textContent=i<queue.length?'🔧':'·';if(i<queue.length){slot.style.cursor='pointer';slot.title='Tap to cancel queued SCV';slot.onclick=()=>cancelQueueItem('base',i)}if(i===0&&queue.length){let bar=document.createElement('div');bar.className='bar';bar.style.width=(queueElapsed/10*100)+'%';slot.append(bar)}slots.append(slot)}train.disabled=money<50||queue.length>=5||used()+queue.length>=supplyCap();train.style.opacity=train.disabled?'.5':'1'}
train.addEventListener('click',()=>{if(money<50){msg('Need 50 minerals');return}if(queue.length>=5){msg('Production queue full');return}if(used()+queue.length>=supplyCap()){msg('Build a Supply Depot for more supply');return}money-=50;queue.push('scv');refreshQueue();msg('SCV queued for production')});
function showPanel(){production.style.display=selected==='base'?'block':'none';if(selected==='base')refreshQueue();refreshInfo()}
const infoQueueEl=document.querySelector('#infoQueue');infoQueueEl.addEventListener('click',e=>{const tile=e.target.closest('[data-queue-index]');if(!tile)return;const i=Number(tile.dataset.queueIndex);if(selected==='base')cancelQueueItem('base',i);else if(selected==='barracks'||selected==='shop')cancelQueueItem('building',i)});
function refreshInfo(){const name=document.querySelector('#infoName'),portrait=document.querySelector('#infoPortrait'),details=document.querySelector('#infoDetails'),q=document.querySelector('#infoQueue'),u=selectedUnit();let label='NO SELECTION',pic='⌖',detail='Tap a unit or building',items=[];if(u){label='SCV';pic='🦾';detail='HP '+u.hp+'/'+u.maxHp+' · ATK '+u.damage+' · '+(u.task||'idle')+(u.load?' · 💎 '+u.load:'')}else if(selected==='base'){label='COMMAND CENTER';pic='🏢';detail='HP '+base.hp+'/'+base.maxHp+' · ATK '+base.damage+' · Training SCVs';items=queue.map((k,i)=>({icon:'🦾',progress:i===0?queueElapsed/10:0}))}else if(selected==='barracks'&&selectedBuilding){label='BARRACKS';pic='🏭';detail='HP '+(selectedBuilding.hp||0)+'/'+selectedBuilding.maxHp+' · ATK '+selectedBuilding.damage+' · '+(selectedBuilding.progress<1?'Building '+Math.round(selectedBuilding.progress*100)+'%':'Ready');items=selectedBuilding.training.map((k,i)=>({icon:k==='firebat'?'🔥':'🪖',progress:i===0?selectedBuilding.trainTime/(k==='firebat'?15:12):0}))}else if(['marine','firebat','goliath','tank'].includes(selected)&&selectedTroop){label=selected==='tank'?'SIEGE TANK':selected.toUpperCase();pic='🪖';detail='HP '+selectedTroop.hp+'/'+selectedTroop.maxHp+' · ATK '+combatStats(selected,selectedTroop.sieged).damage+' · RNG '+combatStats(selected,selectedTroop.sieged).range+' · '+(selectedTroop.sieged?'Sieged':selectedTroop.task)}else if(['shop','bunker','turret'].includes(selected)&&selectedBuilding){label=({shop:'MACHINE SHOP',bunker:'BUNKER',turret:'MISSILE TURRET'})[selected];pic='🏭';detail='HP '+selectedBuilding.hp+'/'+selectedBuilding.maxHp+' · ATK '+selectedBuilding.damage+(selectedBuilding.damage?' · RNG '+selectedBuilding.range:'')+' · '+(selected==='bunker'?'Marines '+selectedBuilding.garrison.length+'/4':selectedBuilding.progress<1?'Building':'Ready');if(selected==='shop')items=selectedBuilding.training.map((k,i)=>({icon:k==='tank'?'🚜':'🤖',progress:i===0?selectedBuilding.trainTime/(k==='tank'?28:22):0}))}else if(selectedMineral){label='MINERAL FIELD';pic='💎';detail=selectedMineral.n+' / 1500 minerals remaining'}else if(selected==='depot'&&selectedBuilding){label='SUPPLY DEPOT';pic='🏗';detail='HP '+selectedBuilding.hp+'/'+selectedBuilding.maxHp+' · ATK '+selectedBuilding.damage+' · +10 supply when complete'}const portraitKey=u?'scv':selected==='base'?'command_center':selected==='barracks'?'barracks':['marine','firebat','goliath','tank'].includes(selected)?(selected==='tank'?(selectedTroop?.sieged?'siege_tank_siege':'siege_tank_mobile'):selected):selected==='shop'?'machine_shop':selected==='bunker'?'bunker':selected==='turret'?'missile_turret':selected==='depot'?'supply_depot':selectedMineral?'minerals':null;name.textContent=label;portrait.textContent=pic;portrait.style.backgroundImage=portraitKey&&spriteImages[portraitKey]?.ready?'url("'+spritePaths[portraitKey]+'")':'none';portrait.style.backgroundSize='contain';portrait.style.backgroundPosition='center';portrait.style.backgroundRepeat='no-repeat';if(portrait.style.backgroundImage!=='none')portrait.textContent='';details.textContent=detail;q.replaceChildren();for(let i=0;i<Math.min(5,items.length);i++){const d=document.createElement('div');d.textContent=items[i].icon;if(selected==='base'||selected==='barracks'||selected==='shop'){d.dataset.queueIndex=String(i);d.title='Tap to cancel and refund';d.style.cursor='pointer'}if(i===0){const bar=document.createElement('div');bar.className='bar';bar.style.width=Math.min(100,items[i].progress*100)+'%';d.append(bar)}q.append(d)}}
function positionOverlays(){
if(selectedMineral&&selectedMineral.n>0){let p=screenPt(selectedMineral.x,selectedMineral.y);if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){deposit.style.display='none'}else{deposit.style.display='block';deposit.textContent='💎 '+selectedMineral.n+'/1500';deposit.style.left=Math.max(6,Math.min(W-90,p.x-40))+'px';deposit.style.top=Math.max(55,Math.min(H-42,p.y-65))+'px'}}else deposit.style.display='none'}
let seed=44;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<165;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>250&&!terrainBlocked(x,y))trees.push({x,y,scale:.8+rnd()*.6})}
for(let i=0;i<42;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>240&&!terrainBlocked(x,y))rocks.push({x,y,scale:.75+rnd()*.8})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function worldPt(sx,sy){const a=(sx-W/2)/zoom,b=(sy-H/2)/zoom;return{x:cam.x+a+b*.48,y:cam.y+b/.68}}
function screenPt(x,y){return{x:W/2+((x-cam.x)-.48*.68*(y-cam.y))*zoom,y:H/2+(y-cam.y)*.68*zoom}}
function clampCam(){cam.x=Math.max(W/(2*zoom),Math.min(world.w-W/(2*zoom),cam.x));cam.y=Math.max(H/(2*zoom),Math.min(world.h-H/(2*zoom),cam.y))}
function msg(s){hint.textContent=s}
function nearestMineral(u,byBase=false){return minerals.filter(m=>m.n>0).sort((a,b)=>{const da=Math.hypot(a.x-(byBase?base.x:u.x),a.y-(byBase?base.y:u.y));const db=Math.hypot(b.x-(byBase?base.x:u.x),b.y-(byBase?base.y:u.y));return da-db})[0]||null}
function setMode(mode){const u=selectedUnit();if(!u)return;commandMode=mode;buttons();if(mode==='move')msg('MOVE: tap the destination');if(mode==='target')msg('MINE TARGET: tap a mineral deposit');if(mode==='auto'){u.mineMode='auto';u.target=nearestMineral(u,true);u.task=u.target?'mine':'idle';commandMode=null;buttons();msg(u.target?'Auto Mine: harvesting deposits nearest the Command Center':'No minerals remaining')}haptic()}

// Four-sided river defense map: the blue diamond is impassable except at four stone crossings.
const CELL=40,GRID_W=Math.ceil(world.w/CELL),GRID_H=Math.ceil(world.h/CELL);
function riverValue(x,y){return Math.abs(x-base.x)+Math.abs(y-base.y)}
function bridgeAt(x,y){
 const dx=x-base.x,dy=y-base.y;
 return (Math.abs(dx)<92&&Math.abs(dy)>470&&Math.abs(dy)<920)||
        (Math.abs(dy)<92&&Math.abs(dx)>470&&Math.abs(dx)<920);
}
function terrainBlocked(x,y){
 if(x<24||y<24||x>world.w-24||y>world.h-24)return true;
 const d=riverValue(x,y);
 return d>645&&d<755&&!bridgeAt(x,y);
}
function terrainCell(x,y){return terrainBlocked((x+.5)*CELL,(y+.5)*CELL)}
function findRoute(sx,sy,tx,ty){
 const ix=v=>Math.max(0,Math.min(GRID_W-1,Math.floor(v/CELL)));
 const iy=v=>Math.max(0,Math.min(GRID_H-1,Math.floor(v/CELL)));
 const start=iy(sy)*GRID_W+ix(sx),goal=iy(ty)*GRID_W+ix(tx);
 if(start===goal)return[{x:tx,y:ty}];
 const size=GRID_W*GRID_H,prev=new Int32Array(size);prev.fill(-1);
 const q=new Int32Array(size);let head=0,tail=0;q[tail++]=start;prev[start]=start;
 const dirs=[1,-1,GRID_W,-GRID_W];
 while(head<tail){
  const cur=q[head++];if(cur===goal)break;
  const cx=cur%GRID_W,cy=Math.floor(cur/GRID_W);
  for(const d of dirs){
   const n=cur+d,nx=n%GRID_W,ny=Math.floor(n/GRID_W);
   if(n<0||n>=size||Math.abs(nx-cx)+Math.abs(ny-cy)!==1||prev[n]!==-1||terrainCell(nx,ny))continue;
   prev[n]=cur;q[tail++]=n;
  }
 }
 if(prev[goal]===-1)return [];
 const route=[];let n=goal;
 while(n!==start&&route.length<size){route.push({x:(n%GRID_W+.5)*CELL,y:(Math.floor(n/GRID_W)+.5)*CELL});n=prev[n]}
 route.reverse();if(!terrainBlocked(tx,ty))route.push({x:tx,y:ty});
 return route;
}
function navigate(u,x,y,speed,dt){
 if(!u.route||Math.hypot((u.routeGoalX??-9999)-x,(u.routeGoalY??-9999)-y)>55){
  u.route=findRoute(u.x,u.y,x,y);u.routeGoalX=x;u.routeGoalY=y;u.routeIndex=0;
 }
 if(!u.route.length)return false;
 let p=u.route[u.routeIndex];if(!p)return true;
 if(approach(u,p.x,p.y,speed,dt)){u.routeIndex++;if(u.routeIndex>=u.route.length){u.route=null;return true}}
 return false;
}

function startTouch(id,x,y){const t={startX:x,startY:y,x,y,lastX:x,lastY:y,moved:false};touches.set(id,t);if(placing&&touches.size===1)ghost=worldPt(x,y);if(touches.size===2){clearEmptyTap();lastTap=null;const a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
