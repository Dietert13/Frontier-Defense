<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#182a22"><title>Frontier Defense</title>
<style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14231d;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#hud{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:13px;text-shadow:0 1px 3px black}#hud span{background:#162a24c9;padding:7px 10px;border-radius:8px}#hud b{color:#a9f2c0}#controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.panel{pointer-events:auto;background:#152720e8;border:1px solid #66816d;border-radius:12px;padding:8px}#map{width:105px;height:82px;touch-action:none}#joy{height:122px;width:122px;border-radius:50%;border:2px solid #a4c5a4;background:#183a30bb;position:relative;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#a4d4b1;box-shadow:0 0 0 2px #315543}#commandPanel{position:fixed;left:120px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));z-index:7;width:auto;min-width:0;max-height:37dvh;overflow-y:auto;background:#152720ed;border:1px solid #83b78c;border-radius:12px;padding:8px}#panelTitle{font-size:13px;font-weight:700;color:#d5f4dc;margin-bottom:7px}#actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}button{background:#244737;border:1px solid #83b78c;color:white;border-radius:8px;padding:9px;font-weight:600}#actions button{min-height:48px;padding:5px 3px;font-size:11px;background:linear-gradient(#34544e,#172b2a);box-shadow:inset 0 1px #8db2a455}#actions button.active{background:#9cdeb1;color:#123320;border-color:#e0ffe5}#production{display:none;width:100%;padding:0;background:transparent}#production h3{font-size:15px;margin:0 0 8px}#slots{display:flex;gap:5px;margin-bottom:10px}#slots>div{flex:1;height:34px;min-width:0;border:1px solid #72977c;border-radius:6px;background:#263e31;position:relative;text-align:center;font-size:17px;padding-top:8px;overflow:hidden}#slots .bar{position:absolute;bottom:0;left:0;height:5px;background:#8bec9f}#production button{width:100%;min-height:43px}#commandPanel:has(#production[style*='block']) #actions{display:none}#commandPanel{box-shadow:0 0 0 2px #253e3a,0 -4px 22px #0008;background:linear-gradient(145deg,#263f3b,#0e1c1c)}@media(max-width:620px){#commandPanel{left:120px;right:8px;width:auto;min-width:0}#actions{grid-template-columns:repeat(2,minmax(0,1fr))}#production h3{font-size:12px}#slots>div{font-size:13px}}#deposit{display:none;position:fixed;z-index:6;background:#152720ed;color:#e8f8e8;border:1px solid #a1d8a7;border-radius:9px;padding:7px 11px;font-size:13px;pointer-events:none;white-space:nowrap}#selectMode{position:fixed;right:12px;top:52px;z-index:9;background:#254c38;border:2px solid #b4e6b5;padding:10px 12px;min-width:112px}#selectMode.active{background:#a3e6ae;color:#10241a}#hint{position:fixed;top:52px;left:10px;font-size:12px;background:#14251fc9;padding:7px;border-radius:6px;pointer-events:none;max-width:70vw}#bottomHud{position:fixed;bottom:0;left:0;right:0;height:clamp(116px,22dvh,175px);padding:7px 7px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(82px,19%) minmax(0,1fr) minmax(118px,30%);gap:5px;z-index:8;background:linear-gradient(180deg,#627489 0%,#132639 8%,#07111f 90%,#42576a);border-top:4px ridge #8aa4b4;box-shadow:0 -5px 18px #000b;color:#bde7ff}#bottomHud>div{min-width:0;border:2px solid #3277a5;border-radius:5px;background:linear-gradient(145deg,#0b1c2e,#030b15);box-shadow:inset 0 0 0 1px #65c2f344}#map{width:100%;height:100%;display:block;padding:2px;border:0;border-radius:0;background:#10251e}#controls{position:static;display:contents}#commandPanel{position:static;transform:none;left:auto;right:auto;bottom:auto;width:auto;min-width:0;max-height:none;overflow:auto;padding:5px;box-shadow:none;border-radius:4px;background:linear-gradient(145deg,#132c43,#071321)}#panelTitle{font-size:10px;margin-bottom:4px;color:#88cafa;text-align:center}#actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}#actions button{min-height:35px;font-size:10px;padding:3px 1px;border-radius:3px;border-color:#5689a8;background:linear-gradient(#224e6b,#102437)}#actions button.active{background:#70b9d9;color:#041321}#infoPanel{padding:6px;display:flex;flex-direction:column;gap:5px;overflow:hidden}#infoName{font-size:12px;font-weight:800;color:#b9e9ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#infoBody{display:flex;gap:7px;min-height:37px;align-items:center}#infoPortrait{width:44px;height:42px;border:1px solid #376b8b;border-radius:3px;background:#122b3c;display:grid;place-items:center;font-size:25px;flex-shrink:0}#infoDetails{font-size:11px;line-height:1.5;color:#c0d7e7;overflow:hidden}#infoQueue{display:flex;gap:3px;align-items:center;min-height:26px}#infoQueue>div{border:1px solid #376c94;background:#102a3d;min-width:23px;height:25px;display:grid;place-items:center;font-size:13px;position:relative;overflow:hidden}#infoQueue .bar{position:absolute;bottom:0;left:0;height:3px;background:#6fe5a2}#production{display:none}#commandPanel:has(#production[style*='block']) #actions{display:grid}#production h3,#slots{display:none}#production button{min-height:40px;padding:4px;font-size:11px;background:#214e6a;border-color:#619fcb}@media(max-width:620px){#commandPanel{left:auto;right:auto;width:auto;min-width:0}#actions{grid-template-columns:repeat(2,minmax(0,1fr))}#bottomHud{grid-template-columns:minmax(78px,20%) minmax(0,1fr) minmax(110px,31%)}#infoPortrait{width:36px;height:36px;font-size:21px}#infoPanel{padding:4px}#infoDetails{font-size:10px}} </style></head>
<body><canvas id="game"></canvas><div id="hud"><span>💎 <b id="minerals">200</b></span><span>👥 <b id="supply">1 / 10</b></span><span>🏢 Frontier Defense v1.2</span></div><div id="hint">Tap a unit or building to select. Swipe to pan. Pinch to zoom.</div><div id="deposit"></div><div id="bottomHud"><div id="controls"><canvas class="panel" id="map" width="210" height="164"></canvas></div><div id="infoPanel"><div id="infoName">NO SELECTION</div><div id="infoBody"><div id="infoPortrait">⌖</div><div id="infoDetails">Tap a unit or building</div></div><div id="infoQueue"></div></div><div id="commandPanel"><div id="panelTitle">COMMANDS</div><div id="actions"></div><div id="production"><h3>Production</h3><div id="slots"></div><button id="train">🔧 Train SCV · 💎 20 · 10s</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#map'),mc=mini.getContext('2d'),actions=document.querySelector('#actions'),hint=document.querySelector('#hint'),production=document.querySelector('#production'),slots=document.querySelector('#slots'),train=document.querySelector('#train'),deposit=document.querySelector('#deposit');
let W=0,H=0,dpr=1,zoom=1,cam={x:1100,y:850},money=200,selected=null,selectedMineral=null,placing=false,buildMenu=false,buildType=null,ghost=null,joyX=0,joyY=0,drag=null,last=performance.now(),touches=new Map(),pinch=0,commandMode=null;
const world={w:2800,h:2100},base={x:1400,y:1050,r:48},units=[makeSCV(1510,1110)],minerals=[{x:1210,y:900,n:100},{x:1150,y:950,n:100},{x:1230,y:1010,n:100},{x:1340,y:830,n:100},{x:1090,y:1040,n:100}],depots=[],barracks=[],marines=[],trees=[],rocks=[],queue=[];let nextId=2,queueElapsed=0;
function makeSCV(x,y){return{id:1,x,y,tx:x,ty:y,speed:115,load:0,task:'idle',target:null,timer:0,mineMode:null}}
function selectedUnit(){return typeof selected==='number'?units.find(u=>u.id===selected):null}
function supplyCap(){return 10+depots.filter(d=>d.progress>=1).length*10}
function refreshQueue(){slots.replaceChildren();for(let i=0;i<5;i++){let slot=document.createElement('div');slot.textContent=i<queue.length?'🔧':'·';if(i===0&&queue.length){let bar=document.createElement('div');bar.className='bar';bar.style.width=(queueElapsed/10*100)+'%';slot.append(bar)}slots.append(slot)}train.disabled=money<20||queue.length>=5||units.length+marines.length+queue.length>=supplyCap();train.style.opacity=train.disabled?'.5':'1'}
train.addEventListener('click',()=>{if(money<20){msg('Need 20 minerals');return}if(queue.length>=5){msg('Production queue full');return}if(units.length+queue.length>=supplyCap()){msg('Build a Supply Depot for more supply');return}money-=20;queue.push('scv');refreshQueue();msg('SCV queued for production')});
function showPanel(){production.style.display=selected==='base'?'block':'none';if(selected==='base')refreshQueue();refreshInfo()}
function refreshInfo(){const name=document.querySelector('#infoName'),portrait=document.querySelector('#infoPortrait'),details=document.querySelector('#infoDetails'),q=document.querySelector('#infoQueue'),u=selectedUnit();let label='NO SELECTION',pic='⌖',detail='Tap a unit or building',items=[];if(u){label='SCV';pic='🦾';detail='HP 60/60 · '+(u.task||'idle')+(u.load?' · 💎 '+u.load:'')}else if(selected==='base'){label='COMMAND CENTER';pic='🏢';detail='HP 1500/1500 · Training SCVs';items=queue.map(()=>({icon:'🦾',progress:queueElapsed/10}))}else if(selected==='barracks'&&selectedBuilding){label='BARRACKS';pic='🏭';detail='HP '+(selectedBuilding.hp||0)+'/600 · '+(selectedBuilding.progress<1?'Building '+Math.round(selectedBuilding.progress*100)+'%':'Ready');items=Array.from({length:selectedBuilding.marineQueue||0},()=>({icon:'🪖',progress:selectedBuilding.trainTime/12}))}else if(selected==='marine'){label='MARINE';pic='🪖';detail='HP '+(selectedMarine?.hp||45)+'/45 · '+(selectedMarine?.task||'idle')}else if(selectedMineral){label='MINERAL FIELD';pic='💎';detail=selectedMineral.n+' / 100 minerals remaining'}else if(selected==='depot'&&selectedBuilding){label='SUPPLY DEPOT';pic='🏗';detail='HP '+selectedBuilding.hp+'/300 · +10 supply when complete'}const portraitKey=u?'scv':selected==='base'?'command_center':selected==='barracks'?'barracks':selected==='marine'?'marine':selected==='depot'?'supply_depot':selectedMineral?'minerals':null;name.textContent=label;portrait.textContent=pic;portrait.style.backgroundImage=portraitKey&&spriteImages[portraitKey]?.ready?'url("'+spritePaths[portraitKey]+'")':'none';portrait.style.backgroundSize='contain';portrait.style.backgroundPosition='center';portrait.style.backgroundRepeat='no-repeat';if(portrait.style.backgroundImage!=='none')portrait.textContent='';details.textContent=detail;q.replaceChildren();for(let i=0;i<Math.min(5,items.length);i++){const d=document.createElement('div');d.textContent=items[i].icon;if(i===0){const bar=document.createElement('div');bar.className='bar';bar.style.width=Math.min(100,items[i].progress*100)+'%';d.append(bar)}q.append(d)}}
function positionOverlays(){
if(selectedMineral&&selectedMineral.n>0){let p=screenPt(selectedMineral.x,selectedMineral.y);if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){deposit.style.display='none'}else{deposit.style.display='block';deposit.textContent='💎 '+selectedMineral.n+'/100';deposit.style.left=Math.max(6,Math.min(W-90,p.x-40))+'px';deposit.style.top=Math.max(55,Math.min(H-42,p.y-65))+'px'}}else deposit.style.display='none'}
let seed=44;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<165;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>250)trees.push({x,y})}
for(let i=0;i<42;i++){let x=50+rnd()*(world.w-100),y=50+rnd()*(world.h-100);if(Math.hypot(x-base.x,y-base.y)>240)rocks.push({x,y})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function worldPt(sx,sy){const a=(sx-W/2)/zoom,b=(sy-H/2)/zoom;return{x:cam.x+a+b*.48,y:cam.y+b/.68}}
function screenPt(x,y){return{x:W/2+((x-cam.x)-.48*.68*(y-cam.y))*zoom,y:H/2+(y-cam.y)*.68*zoom}}
function clampCam(){cam.x=Math.max(W/(2*zoom),Math.min(world.w-W/(2*zoom),cam.x));cam.y=Math.max(H/(2*zoom),Math.min(world.h-H/(2*zoom),cam.y))}
function msg(s){hint.textContent=s}
function nearestMineral(u,byBase=false){return minerals.filter(m=>m.n>0).sort((a,b)=>{const da=Math.hypot(a.x-(byBase?base.x:u.x),a.y-(byBase?base.y:u.y));const db=Math.hypot(b.x-(byBase?base.x:u.x),b.y-(byBase?base.y:u.y));return da-db})[0]||null}
function setMode(mode){const u=selectedUnit();if(!u)return;commandMode=mode;buttons();if(mode==='move')msg('MOVE: tap the destination');if(mode==='target')msg('MINE TARGET: tap a mineral deposit');if(mode==='auto'){u.mineMode='auto';u.target=nearestMineral(u,true);u.task=u.target?'mine':'idle';commandMode=null;buttons();msg(u.target?'Auto Mine: harvesting deposits nearest the Command Center':'No minerals remaining')}haptic()}
function buttons(){actions.replaceChildren();showPanel();const title=document.querySelector('#panelTitle'),u=selectedUnit();title.textContent=selected==='base'?'COMMAND CENTER':selected==='barracks'?'BARRACKS':selected==='marine'?'MARINE':u?(buildMenu?'SCV · BUILD STRUCTURES':'SCV · COMMANDS'):'FRONTIER DEFENSE';
function add(label,fn,active=false){const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(active)b.classList.add('active');actions.append(b)}
if(u){if(buildMenu){add('🏭 Supply Depot · 20',()=>beginBuild('depot'));add('🏗 Barracks · 75',()=>beginBuild('barracks'));add('↩ Back',()=>{buildMenu=false;buttons()})}
else{add('↗ Move',()=>setMode('move'),commandMode==='move');add('💎 Mine Target',()=>setMode('target'),commandMode==='target');add('⛏ Auto Mine',()=>setMode('auto'));add('🏗 Build',()=>{buildMenu=true;commandMode=null;buttons()});add('■ Stop',()=>{u.task='idle';u.mineMode=null;u.target=null;msg('SCV stopped')});add('✕ Deselect',()=>{selected=null;buttons()})}}
if(selected==='barracks'){add('🪖 Train Marine · 35',()=>{const b=barracks.find(b=>b===selectedBuilding)||barracks[0];if(!b||b.progress<1){msg('Barracks not complete');return}if(money<35){msg('Need 35 minerals');return}if(units.length+marines.length+queue.length>=supplyCap()){msg('Not enough supply');return}money-=35;b.marineQueue=(b.marineQueue||0)+1;msg('Marine queued ('+b.marineQueue+')');buttons()});const b=selectedBuilding;if(b)add('Queue: '+(b.marineQueue||0),()=>msg('Marines train automatically'))}
if(selected==='depot'){add('✓ Supply +10',()=>msg('Supply Depot'))}if(selected==='marine'){add('↗ Move',()=>{commandMode='marineMove';msg('Tap destination for Marine')});add('■ Stop',()=>{if(selectedMarine)selectedMarine.task='idle'})}
}
function beginBuild(type){const cost=type==='depot'?20:75;if(money<cost){msg('Need '+cost+' minerals');return}buildType=type;placing=true;buildMenu=false;ghost={x:cam.x,y:cam.y};msg('Move your finger to position the ghost, then tap to place '+(type==='depot'?'Supply Depot':'Barracks'));buttons()}
let selectedBuilding=null,selectedMarine=null;
function haptic(){if(navigator.vibrate)navigator.vibrate(12)}
function findTarget(p){let soldier=marines.find(u=>Math.hypot(p.x-u.x,p.y-u.y)<33);if(soldier)return{kind:'marine',value:soldier};let bar=barracks.find(b=>Math.hypot(p.x-b.x,p.y-b.y)<65);if(bar)return{kind:'barracks',value:bar};let u=units.find(u=>Math.hypot(p.x-u.x,p.y-u.y)<30);if(u)return{kind:'unit',value:u};if(Math.hypot(p.x-base.x,p.y-base.y)<55)return{kind:'base'};let m=minerals.find(m=>m.n>0&&Math.hypot(p.x-m.x,p.y-m.y)<43);if(m)return{kind:'mineral',value:m};let d=depots.find(d=>Math.hypot(p.x-d.x,p.y-d.y)<36);if(d)return{kind:'depot',value:d};return null}
function selectAt(p){commandMode=null;placing=false;ghost=null;buildMenu=false;let t=findTarget(p);selectedMineral=null;selectedBuilding=null;selectedMarine=null;if(!t){selected=null;msg('Nothing selected')}else if(t.kind==='unit'){selected=t.value.id;msg('SCV selected. Choose an action below.')}else if(t.kind==='depot'){selected='depot';selectedBuilding=t.value;msg('Supply Depot selected')}else if(t.kind==='barracks'){selected='barracks';selectedBuilding=t.value;msg('Barracks selected')}else if(t.kind==='marine'){selected='marine';selectedMarine=t.value;msg('Marine selected')}else if(t.kind==='base'){selected='base';msg('Command Center selected. Train SCVs in the queue.')}else if(t.kind==='mineral'){selected=null;selectedMineral=t.value;msg('Mineral deposit: '+t.value.n+'/100 remaining')}else{selected=null;msg('Nothing selected')}buttons();haptic()}
function validSite(p){return p.x>70&&p.y>70&&p.x<world.w-70&&p.y<world.h-70&&Math.hypot(p.x-base.x,p.y-base.y)>=135&&[...depots,...barracks].every(d=>Math.hypot(p.x-d.x,p.y-d.y)>=100)&&minerals.every(m=>m.n<=0||Math.hypot(p.x-m.x,p.y-m.y)>=75)}
function order(p){if(placing){const cost=buildType==='barracks'?75:20;if(money<cost){placing=false;msg('Not enough minerals');return}if(!validSite(p)){ghost=p;msg('Red ghost: choose open ground away from buildings or minerals');return}const u=selectedUnit();if(!u)return;money-=cost;const b={x:p.x,y:p.y,progress:0,hp:1,type:buildType,marineQueue:0,trainTime:0};(buildType==='barracks'?barracks:depots).push(b);u.task='construct';u.building=b;u.mineMode=null;placing=false;ghost=null;buildType=null;msg('SCV constructing '+(b.type==='barracks'?'Barracks':'Supply Depot'));buttons();return}
const u=selectedUnit(),t=findTarget(p);
if(commandMode==='marineMove'&&selectedMarine){selectedMarine.tx=p.x;selectedMarine.ty=p.y;selectedMarine.task='move';commandMode=null;msg('Marine moving');return}if(!u){msg('Tap an SCV or Command Center to select it');haptic();return}
if(commandMode==='target'){if(!t||t.kind!=='mineral'){msg('Tap a mineral deposit to mine it');return}u.mineMode='target';u.target=t.value;u.task='mine';selectedMineral=t.value;commandMode=null;buttons();msg('SCV mining selected deposit ('+t.value.n+'/100)');haptic();return}
if(commandMode==='move'){u.mineMode=null;u.target=null;u.task='move';u.tx=p.x;u.ty=p.y;commandMode=null;buttons();msg('SCV moving');haptic();return}
if(t&&t.kind==='mineral'){selectedMineral=t.value;msg('Deposit: '+t.value.n+'/100. Choose Mine Target to gather.');haptic();return}
msg('Choose an SCV action: Move, Mine Target, or Auto Mine');haptic()}
const MOVE_TOLERANCE=12;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
function startTouch(id,x,y){const t={startX:x,startY:y,x,y,lastX:x,lastY:y,moved:false};touches.set(id,t);if(placing)ghost=worldPt(x,y);if(touches.size===2){const a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
function moveTouch(id,x,y){const t=touches.get(id);if(!t)return;const dx=x-t.lastX,dy=y-t.lastY;t.x=x;t.y=y;t.lastX=x;t.lastY=y;if(Math.hypot(x-t.startX,y-t.startY)>MOVE_TOLERANCE)t.moved=true;if(placing&&touches.size===1){ghost=worldPt(x,y);return}
if(touches.size===2){const a=[...touches.values()];for(const v of a)v.moved=true;const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom=Math.max(.55,Math.min(1.8,zoom*dist/pinch));pinch=dist;clampCam()}
else if(t.moved){cam.x-=dx/zoom;cam.y-=dy/zoom;clampCam()}}
function endTouch(id,x,y,cancelled=false){const t=touches.get(id);if(!t)return;if(!cancelled&&touches.size===1&&(placing||!t.moved)){const p=worldPt(x,y);const target=findTarget(p);if(placing)order(p);else if(commandMode==='move'||commandMode==='target'||commandMode==='marineMove')order(p);else if(target)selectAt(p);else if(selectedUnit())msg('Choose Move, Mine Target, or Auto Mine below');else{selected=null;selectedMineral=null;buttons()}}touches.delete(id);pinch=0}
canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)startTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)moveTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)endTouch(t.identifier,t.clientX,t.clientY)},{passive:false});
canvas.addEventListener('touchcancel',e=>{e.preventDefault();for(const t of e.changedTouches)endTouch(t.identifier,t.clientX,t.clientY,true)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;canvas.setPointerCapture(e.pointerId);startTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;moveTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;endTouch(e.pointerId,e.clientX,e.clientY)});
canvas.addEventListener('pointercancel',e=>{if(e.pointerType==='touch')return;endTouch(e.pointerId,e.clientX,e.clientY,true)});
mini.addEventListener('pointerdown',e=>{let r=mini.getBoundingClientRect();cam.x=(e.clientX-r.left)/r.width*world.w;cam.y=(e.clientY-r.top)/r.height*world.h;clampCam()});
function approach(u,x,y,speed,dt){let dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy);if(d<=speed*dt){u.x=x;u.y=y;return true}u.x+=dx/d*speed*dt;u.y+=dy/d*speed*dt;return false}
function update(dt){clampCam();
if(queue.length){queueElapsed+=dt;if(queueElapsed>=10){queueElapsed-=10;queue.shift();let n=units.length,u=makeSCV(base.x+65+(n%4)*24,base.y+65+Math.floor(n/4)*24);u.id=nextId++;units.push(u);msg('New SCV ready!');refreshQueue()}}
for(const b of barracks){if(b.progress>=1&&b.marineQueue>0){b.trainTime+=dt;if(b.trainTime>=12){b.trainTime-=12;b.marineQueue--;marines.push({x:b.x+65,y:b.y+65,tx:b.x+65,ty:b.y+65,task:'idle',speed:125,hp:45});msg('Marine ready')}}}for(const m of marines){if(m.task==='move'&&approach(m,m.tx,m.ty,m.speed,dt))m.task='idle'}
for(const u of units){if(u.task==='construct'){const b=u.building;if(!b){u.task='idle';continue}if(Math.hypot(u.x-b.x,u.y-b.y)>60){approach(u,b.x+48,b.y+35,u.speed,dt)}else{b.progress=Math.min(1,b.progress+dt/10);b.hp=Math.ceil(b.progress* (b.type==='barracks'?600:300));if(b.progress>=1){u.task='idle';u.building=null;msg((b.type==='barracks'?'Barracks':'Supply Depot')+' complete!')}}continue}
if(u.task==='move'){if(approach(u,u.tx,u.ty,u.speed,dt))u.task='idle'}
if(u.task==='mine'){let m=u.target;if(!m||m.n<=0){if(u.mineMode==='auto'){u.target=nearestMineral(u,true);m=u.target}else{u.task='idle';u.target=null;continue}}if(!m){u.task='idle';continue}if(approach(u,m.x+22,m.y+20,u.speed,dt)){u.task='mining';u.timer=1.3}}
else if(u.task==='mining'){u.timer-=dt;if(u.timer<=0){if(!u.target||u.target.n<=0){u.task='mine';continue}u.load=Math.min(10,u.target.n);u.target.n-=u.load;u.task='return';if(u.target.n<=0)msg('Mineral deposit depleted!')}}
else if(u.task==='return'){if(approach(u,base.x+60,base.y+10,u.speed,dt)){money+=u.load;u.load=0;if(u.mineMode==='auto'){u.target=nearestMineral(u,true);u.task=u.target?'mine':'idle'}else if(u.mineMode==='target'&&u.target&&u.target.n>0){u.task='mine'}else{u.task='idle';u.target=null}}}
}
document.querySelector('#minerals').textContent=money;document.querySelector('#supply').textContent=(units.length+marines.length)+' / '+supplyCap();if(selected==='base'){let bar=slots.querySelector('.bar');if(bar)bar.style.width=(queueElapsed/10*100)+'%';train.disabled=money<20||queue.length>=5||units.length+queue.length>=supplyCap();train.style.opacity=train.disabled?'.5':'1'}}
// Sprite artwork is loaded from the repository's organized asset folders.
const spritePaths={
 scv:'sprites/units/scv.png',marine:'sprites/units/marine.png',firebat:'sprites/units/firebat.png',
 medic:'sprites/units/medic.png',goliath:'sprites/units/goliath.png',
 siege_tank_mobile:'sprites/units/siege_tank_mobile.png',siege_tank_siege:'sprites/units/siege_tank_siege.png',
 command_center:'sprites/buildings/command_center.png',supply_depot:'sprites/buildings/supply_depot.png',
 barracks:'sprites/buildings/barracks.png',machine_shop:'sprites/buildings/machine_shop.png',
 bunker:'sprites/buildings/bunker.png',missile_turret:'sprites/buildings/missile_turret.png',
 minerals:'sprites/resources/minerals.png'
};
const spriteImages={};
for(const [key,path] of Object.entries(spritePaths)){
 const img=new Image();img.onload=()=>{img.ready=true};img.onerror=()=>{img.ready=false};img.src=path;spriteImages[key]=img;
}
// Canvas terrain is skewed for the world view; counter-transform sprites so their artwork stays upright.
function sprite(key,x,y,width,height,opacity=1){
 const img=spriteImages[key];if(!img||!img.ready)return false;
 ctx.save();ctx.translate(x,y);ctx.transform(1,0,.48,1/.68,0,0);ctx.globalAlpha*=opacity;
 const ratio=Math.min(width/img.naturalWidth,height/img.naturalHeight);
 const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
 ctx.drawImage(img,-w/2,-h,w,h);ctx.restore();return true;
}
function poly(points,fill,stroke='#142a2b',width=2){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
function box3(x,y,w,h,tall,front='#42585d',top='#85979a',side='#273c44'){poly([[x-w,y-h],[x+w,y-h],[x+w+15,y-h+9],[x+15,y-h+9]],top);poly([[x-w,y-h],[x+15,y-h+9],[x+15,y+tall],[x-w,y+tall-9]],front);poly([[x+15,y-h+9],[x+w+15,y-h+9],[x+w+15,y+tall-9],[x+15,y+tall]],side)}
function crystal(x,y,k=1){ctx.save();ctx.translate(x,y);ctx.scale(k,k);poly([[-22,8],[-12,-23],[-3,-37],[6,-14],[14,8]],'#247ea9','#8ce8fa');poly([[-3,-37],[6,-14],[14,8],[2,4]],'#3bc3ec','#b5f6ff');poly([[5,11],[17,-12],[27,-20],[32,4]],'#197aaf','#8de6ff');ctx.restore()}
function figurine(x,y,marine=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#061b1c99';ctx.beginPath();ctx.ellipse(0,12,23,9,0,0,7);ctx.fill();if(marine){poly([[-12,-2],[-8,-23],[6,-27],[16,-8],[10,10],[-10,10]],'#5e8390','#0a2c34');poly([[-6,-25],[3,-33],[11,-23],[8,-12]],'#c5d6ce');poly([[7,-7],[27,-17],[30,-12],[9,1]],'#202e33');poly([[-12,9],[-2,9],[-2,17],[-15,17]],'#344c56');poly([[5,9],[15,9],[15,17],[5,17]],'#344c56')}else{poly([[-17,-5],[-11,-27],[9,-29],[19,-6],[12,13],[-14,13]],'#b28c47','#473c2c');poly([[-10,-28],[0,-37],[12,-26],[7,-15]],'#c6b77d');poly([[-20,-9],[-31,0],[-28,16],[-15,10]],'#7c8d8a');poly([[18,-11],[32,-4],[27,17],[14,10]],'#829a98');poly([[-14,12],[-3,12],[-5,21],[-17,21]],'#394c4a');poly([[5,12],[16,12],[17,21],[5,21]],'#394c4a')}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1c322b';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-cam.x*zoom+cam.y*.3264*zoom,H/2-cam.y*.68*zoom);ctx.scale(zoom,zoom);ctx.transform(1,0,-.3264,.68,0,0);ctx.fillStyle='#52694b';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#78936b33';ctx.lineWidth=1;for(let x=0;x<world.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
for(const t of trees){ctx.fillStyle='#253f31';ctx.beginPath();ctx.ellipse(t.x,t.y,17,10,0,0,7);ctx.fill();poly([[t.x-15,t.y],[t.x,t.y-44],[t.x+17,t.y]],'#28583c','#163f31');poly([[t.x-12,t.y-13],[t.x,t.y-55],[t.x+12,t.y-13]],'#427c51')}
for(const r of rocks)poly([[r.x-18,r.y+8],[r.x-14,r.y-8],[r.x+2,r.y-18],[r.x+19,r.y-2],[r.x+15,r.y+9]],'#7a8174','#354e4b');
for(const m of minerals)if(m.n>0){if(!sprite('minerals',m.x,m.y+15,78,77,Math.max(.55,m.n/100)))crystal(m.x,m.y,Math.max(.5,Math.sqrt(m.n/100)));}
if(selectedMineral&&selectedMineral.n>0){ctx.strokeStyle='#a3ffd4';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(selectedMineral.x,selectedMineral.y+10,34,17,0,0,7);ctx.stroke()}
if(!sprite('command_center',base.x,base.y+46,180,165)){box3(base.x,base.y,48,43,28,'#526d75','#91a8a9','#314e5c');box3(base.x,base.y-18,25,20,20,'#526f7c','#bec9b8','#304a5b');ctx.fillStyle='#67c5ed';ctx.fillRect(base.x-22,base.y-12,14,9);ctx.fillRect(base.x+17,base.y-12,14,9)}
if(selected==='base'){ctx.strokeStyle='#9bffc4';ctx.lineWidth=3;ctx.strokeRect(base.x-58,base.y-53,116,107)}
for(const b of [...depots,...barracks]){const w=b.type==='barracks'?39:27;if(!sprite(b.type==='barracks'?'barracks':'supply_depot',b.x,b.y+32,b.type==='barracks'?145:105,b.type==='barracks'?128:98,b.progress<1?.65:1)){box3(b.x,b.y,w,w*.8,b.type==='barracks'?28:19,b.type==='barracks'?'#52616a':'#766d55',b.type==='barracks'?'#9aa5a2':'#b5aa85');if(b.type==='barracks'){ctx.fillStyle='#7cd3e5';ctx.fillRect(b.x-20,b.y-4,20,10)}}if(b.progress<1){ctx.fillStyle='#0a211f';ctx.fillRect(b.x-40,b.y-67,80,12);ctx.strokeStyle='#a3c7b6';ctx.lineWidth=2;ctx.strokeRect(b.x-40,b.y-67,80,12);ctx.fillStyle='#70e49c';ctx.fillRect(b.x-38,b.y-65,76*b.progress,8)}}
if(placing&&ghost){ctx.save();ctx.globalAlpha=.53;const g=ghost,w=buildType==='barracks'?39:27;if(!sprite(buildType==='barracks'?'barracks':'supply_depot',g.x,g.y+32,buildType==='barracks'?145:105,buildType==='barracks'?128:98)){box3(g.x,g.y,w,w*.8,buildType==='barracks'?28:19,validSite(g)?'#4eab7b':'#c24b4b',validSite(g)?'#a5e7bd':'#f2a0a0')}ctx.globalAlpha=1;ctx.strokeStyle=validSite(g)?'#8df6b3':'#ff7676';ctx.lineWidth=3;ctx.strokeRect(g.x-w-9,g.y-w-15,w*2+18,w*2+18);ctx.restore()}
for(const u of units){if(selected===u.id){ctx.strokeStyle='#85f6a2';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(u.x,u.y+15,25,12,0,0,7);ctx.stroke()}if(!sprite('scv',u.x,u.y+16,57,66))figurine(u.x,u.y);if(u.load)crystal(u.x+19,u.y-13,.35)}
for(const m of marines){if(selectedMarine===m){ctx.strokeStyle='#85f6a2';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(m.x,m.y+15,25,12,0,0,7);ctx.stroke()}if(!sprite('marine',m.x,m.y+16,47,60))figurine(m.x,m.y,true)}
ctx.restore();mc.fillStyle='#344f41';mc.fillRect(0,0,210,164);mc.fillStyle='#8fe5a1';mc.fillRect(base.x/world.w*210-3,base.y/world.h*164-3,6,6);mc.fillStyle='#80ccf2';for(const m of minerals)if(m.n>0)mc.fillRect(m.x/world.w*210,m.y/world.h*164,3,3);mc.strokeStyle='#f4f7d1';mc.lineWidth=2;mc.strokeRect((cam.x-W/(2*zoom))/world.w*210,(cam.y-H/(2*zoom))/world.h*164,W/zoom/world.w*210,H/zoom/world.h*164)}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();positionOverlays();refreshInfo();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
